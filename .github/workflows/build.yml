name: Build Runtree

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    if: github.ref == 'refs/heads/main'

    # Pinned, so that a new ubuntu-latest does not change the build environment unexpectedly.
    # All packages below are available on Ubuntu 26.04 (checked on 2026-10-17).
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # The Go build cache is saved and restored by setup-go (keyed on go.sum). It also holds the compiled cgo
    # packages (gotk4), which take most of the build time without the cache.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libgtk-4-dev libvte-2.91-gtk4-dev libgirepository1.0-dev

    - name: Run tests
      env:
        CGO_ENABLED: 1
      run: go test ./...

    - name: Run build script
      env:
        CGO_ENABLED: 1
      run: python3 scripts/build.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-amd64-binaries
        path: |
          dist/linux/amd64/rtrunner
          dist/linux/amd64/rtrunner_debug
          dist/linux/amd64/runtree
          dist/linux/amd64/runtree_debug
          dist/linux/amd64/runtree-headless
          dist/linux/amd64/runtree-headless_debug
          dist/linux/amd64/runtree-lsp
          dist/linux/amd64/runtree-lsp_debug
          dist/rtrunners/
          dist/windows/amd64/
        if-no-files-found: error
